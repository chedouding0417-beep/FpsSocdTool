; ============================================================
;  FPS SOCD 急停助手 配置文件
;  修改后可在托盘菜单选择“重新加载配置”，或重启工具。
; ============================================================

[General]
; 启动工具后是否立即开启反向补键（true/false）
StartEnabled=false

; 松开 A/D 后，向反方向轻点的持续时间（5-300 毫秒）
; 越大反向移动越明显，建议 20-50
TapMs=1

; 两次补键之间的最小间隔（0-2000 毫秒），防止连点抖动
CooldownMs=70

; 另一方向键正被按住时，是否跳过补键
SkipIfOppositeHeld=true

; 发送扫描码（true）或虚拟键（false）
; 游戏不识别时可以把 true 改成 false 再试
UseScanCodes=true

; 仅在指定进程为前台时生效，逗号分隔；留空 = 所有程序
; 例如：OnlyInProcess=game.exe
OnlyInProcess=

; 切换开关时是否播放提示音 / 显示托盘气泡
Beep=true
Notify=true

; 是否把每次补键写入 socd.log（调试用，平时建议 false）
LogTaps=false

[Hotkeys]
; 开启/暂停开关；支持 F1-F24、A-Z、0-9 及 Ctrl/Alt/Shift/Win 组合
; 例如 Ctrl+Shift+O、Ctrl+Alt+S
Toggle=Ctrl+Shift+O

; 可选备用开启/暂停热键；留空=关闭
FallbackToggle=

; 紧急停止（强制暂停）
Panic=F9
